<!DOCTYPE html>
<html>
<head>
    <title>Конвертер валют</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2>Конвертер валют</h2>

<button class="btn btn-secondary mb-3" onclick="updateRates()">
    Обновить курсы
</button>

<div id="update-status" class="mb-3 text-muted"></div>
<div class="mb-3">
    <input id="amount" class="form-control" placeholder="Amount">
</div>

<div class="mb-3">
    <select id="from" class="form-select mb-3" placeholder="From (USD)"></select>
</div>

<div class="mb-3">
   <select id="to" class="form-select mb-3" placeholder="To (EUR)"></select>
</div>

<button class="btn btn-primary" onclick="convert()">Конвертировать</button>

<p class="mt-3" id="result"></p>

<script src="/static/js/main.js"></script>
</body>
</html>
